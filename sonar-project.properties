sonar.projectKey=otp-service
sonar.projectName=OTP Service
sonar.projectVersion=1.0

# Path to sources
sonar.sources=.
sonar.exclusions=**/tests/**, **/__pycache__/**, .github/**, .gitignore, requirements.txt, Dockerfile, README.md, .coverage, coverage.xml

# Path to tests
sonar.tests=tests
sonar.test.inclusions=**/test_*.py

# Language
sonar.language=py
sonar.python.version=3.12

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report
sonar.python.coverage.reportPaths=coverage.xml
